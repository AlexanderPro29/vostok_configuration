# Базовая конфигурация VOSTOK v9.5
# ------------------------
# Файл распространяется под лицензией CC-BY 4.0
# ------------------------
# Плата: Fysetc Spider v2.2 F446 + raspberry pi B ver1.2, подключение UART
# Драйверы: 7x tmc2209
# 2 пассивных платы Fly MiniAB
# Датчик автоуровня: BTT Microprobe
# Доп.оборудование: дисплей mini12864 с подсветкой, бипером, энкодером и кард ридером
# https://github.com/FYSETC/FYSETC-SPIDER
#--------------------------------------------------------
#          Оборудование             |      Разъём       |
#-----------------------------------|-------------------|
# Мотор оси X                       | M1 X-MOT          |
# Мотор оси W                       | M2 Y-MOT          |
# Левый мотор оси Y                 | M3 Z-MOT          |
# Правый мотор оси Y                | M4 E0-MOT         |
# Мотор оси Z                       | M5 E1-MOT         |
# Мотор фидера левой головы         | M6 E2-MOT         |
# Мотор фидера правой головы        | M7 E3-MOT         |
# Нагреватель левой головы          | E0 out            |
# Нагреватель правой головы         | E1 out            |
# Нагреватель стола                 | BED out           |
# Термистор левой головы            | TE0               |
# Термистор правой головы           | TE1               |
# Термистор стола                   | TB                |
# Охлаждение хотэнда левой головы   | FAN0              |
# Охлаждение хотэнда правой головы  | FAN1              |
# Охлаждение модели                 | 5V RGB            |  #https://mellow.klipper.cn/en/docs/ProductDoc/ExtensionBoard/fly-7040/wiring/
# Охлаждение отсека электроники     | FAN2              |
# Концевик оси X                    | X-                |
# Концевик оси W                    | X+                |
# Концевик оси Y левый              | Y-                |
# Концевик оси Y правый             | Z+                |
# Датчик автоуровня                 | BLTouch (Y+ Z-)   |
#--------------------------------------------------------
#
# Двигатели
#########################################################

[stepper motor_x]   #M1 X-MOT
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
full_steps_per_rotation: 200

[stepper motor_w] #M2 Y-MOT
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
full_steps_per_rotation: 200

[stepper motor_yl] #M3 Z-MOT
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
full_steps_per_rotation: 200

[stepper motor_yr] #M4 E0-MOT
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
full_steps_per_rotation: 200

[stepper motor_z] #M5 E1-MOT
step_pin: PE6
dir_pin: PC13     #направление вращения
enable_pin: !PE5
full_steps_per_rotation: 200

[extruder]  #M6 E2-MOT
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3
full_steps_per_rotation: 200

[extruder1] #M7 E3-MOT
step_pin: PD12
dir_pin: PC4
enable_pin: !PE8
full_steps_per_rotation: 200

#########################################################
# Драйверы
#########################################################

[tmc2209 stepper motor_x]
uart_pin: PE7
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper motor_w]
uart_pin: PE15
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper motor_yl]
sense_resistor: 0.110
uart_pin: PD10
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper motor_yr]
sense_resistor: 0.110
uart_pin: PD7
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper motor_z]
uart_pin: PC14
run_current: 0.9
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PC15
run_current: 0.9
stealthchop_threshold: 0

[tmc2209 extruder1]
uart_pin: PA15
run_current: 0.9
stealthchop_threshold: 0

#########################################################
# Концевики и датчик автоуровня
#########################################################

[carriage xc]
endstop_pin: ^PB14

[dual_carriage wc]
endstop_pin: ^PA1

[carriage ylc]
endstop_pin: ^PB13

[extra_carriage yrc]
endstop_pin: ^PA3

[probe]
pin: ^!PA0

[output_pin probe_enable]
pin: PA2
value: 0

[gcode_macro PROBE_DEPLOY]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_STOW]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

#########################################################
# Нагреватели и термисторы
#########################################################

[extruder]
heater_pin: PB15
sensor_pin: PC0

[extruder1]
heater_pin: PC8
sensor_pin: PC1

[heater_bed]
heater_pin: PB4
sensor_pin: PB0

#########################################################
# Вентиляторы
#########################################################

[fan]
pin: PD3

[heater_fan e0_fan]
pin: PA13

[heater_fan e1_fan]
pin: PA14

[controller_fan electronics_fan]
pin: PB2

#####################################################################
#   Displays добавим немного ворона )
#####################################################################

#--------------------------------------------------------------------

#   mini12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: PC11
a0_pin: PD2
rst_pin: PC10
encoder_pins: ^PC6,^PC7
click_pin: ^!PA8
contrast: 63
#spi_bus: spi1
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5

#   To control Neopixel RGB in mini12864 display
[neopixel fysetc_mini12864]
pin: PC12
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

#   Set RGB values on boot up for each Neopixel. 
#   Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3 

[output_pin beeper]
pin: PC9
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
scale: 1000

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %} ; Частота в Гц
    {% set P = params.P|default(100)|int %} ; Длительность в миллисекундах
    
    SET_PIN PIN=beeper VALUE={S}
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

#--------------------------------------------------------------------
